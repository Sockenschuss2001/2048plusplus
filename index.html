<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="2048++"><meta name="theme-color" content="#eef5fb"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>2048++ v0.3.7</title></head><body><main>
<header><div class="brand"><b>2048</b><span>++</span></div><div class="score"><small>SCORE</small><b id="score">0</b></div><div class="score"><small>BEST</small><b id="best">0</b></div></header>
<div class="sub"><span>Nächstes Ziel: <b id="goal">128</b></span><span class="ver">v0.3.7</span></div>
<nav><button id="undoBtn" class="undo-btn" onclick="undo()"><svg class="undo-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M13 7 5 15l8 8v-5h6c4.5 0 7 2.2 8 7 1.2-8.5-2.8-13-8-13h-6V7Z"/></svg><span id="undoCount">0</span></button><button disabled>AUTO</button><button disabled>COACH</button><button id="menu">☰</button></nav>
<div id="game"><div id="grid"></div><div id="tiles"></div></div>
<div class="stats"><span>Züge <b id="moves">0</b></span><span>Frei <b id="free">0</b></span><span>Zeit <b id="time">00:00</b></span></div>
<section class="next"><label><b>NEXT</b><select id="preview"><option value="off">Aus</option><option value="value">Wert</option><option value="full">Wert + Position</option></select></label><div id="next"></div></section>
<aside id="panel" class="hidden"><h2>2048++ <small>v0.3.7</small></h2><div class="actions"><button onclick="newGame()">Neues Spiel</button></div><h3>Farbschema</h3><div class="theme-row"><button class="theme-btn" data-theme="blue">Blau</button><button class="theme-btn" data-theme="original">Original</button><button class="theme-btn" data-theme="deepblue">Dunkelblau</button></div><h3>Bestmarken</h3><div id="records"></div><h3>Aktuelle Meilensteine</h3><div id="marks">Noch keine.</div><h3>Checkpoints</h3><div id="cps">Noch keine.</div><h3>Run-Historie</h3><div id="runs">Noch keine abgeschlossenen Runs.</div><button id="close">Schließen</button></aside>
</main>
<div id="gameover" class="gameover hidden" role="dialog" aria-modal="true" aria-labelledby="gameover-title">
  <div class="gameover-card">
    <h2 id="gameover-title">Game over</h2>
    <div id="gameover-score"></div>
    <button id="gameover-new">Neues Spiel</button>
  </div>
</div><script src="app.js"></script></body></html>
